# Paste these location blocks INSIDE the HTTPS server block of your Baota site.
# Delete/disable any pre-existing "location /" or Python plugin proxy that conflicts.
# Keep Baota's certificate and ACME challenge settings; do not replace the whole server block.
client_max_body_size 2m;
location ~ /\.(?!well-known/) {
    deny all;
}
location / {
    proxy_pass http://127.0.0.1:8895;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite untrusted client forwarding headers, since the app trusts ONE proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
}
