name: Browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install
        working-directory: browser-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: browser-tests
      - run: |
          if [ -d system.spec.cjs-snapshots ]; then
            npm test
          else
            npm test -- --grep-invert "visual baseline"
            echo "::notice::Visual baseline is not committed. Generate and review snapshots before enabling visual comparisons."
          fi
        working-directory: browser-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
